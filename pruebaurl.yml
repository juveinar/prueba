---
- name: Prueba resumida de salida HTTPS desde AWX
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    endpoints_https:
      - name: CrowdStrike
        host: ts01-gyr-maverick.cloudsink.net
        port: 443

      - name: Claro Cloud VCD
        host: vcd.clarocloud.com
        port: 443

  tasks:
    - name: Validar TLS por TCP 443
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ item.host }}:{{ item.port }}"
          - -servername
          - "{{ item.host }}"
          - -brief
      loop: "{{ endpoints_https }}"
      loop_control:
        label: "{{ item.name }} — {{ item.host }}:{{ item.port }}"
      register: tls_checks
      changed_when: false
      failed_when: false

    - name: Construir resultado resumido por destino
      ansible.builtin.set_fact:
        connectivity_summary: >-
          {{
            (connectivity_summary | default([])) +
            [
              {
                'name': item.item.name,
                'host': item.item.host,
                'port': item.item.port,
                'rc': item.rc,
                'output': (
                  (item.stdout | default('')) ~ '\n' ~
                  (item.stderr | default(''))
                ),
                'connected': (
                  item.rc == 0 and
                  'CONNECTION ESTABLISHED' in (
                    (item.stdout | default('')) ~ '\n' ~
                    (item.stderr | default(''))
                  )
                ),
                'certificate_valid': (
                  'Verification: OK' in (
                    (item.stdout | default('')) ~ '\n' ~
                    (item.stderr | default(''))
                  )
                )
              }
            ]
          }}
      loop: "{{ tls_checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Mostrar resumen de conectividad
      ansible.builtin.debug:
        msg: |
          ============================================================
          RESUMEN DE CONECTIVIDAD HTTPS DESDE AWX
          ============================================================
          {% for item in connectivity_summary %}
          Destino     : {{ item.name }}
          URL         : https://{{ item.host }}:{{ item.port }}
          TCP/TLS     : {{ 'CONECTIVIDAD OK' if item.connected else 'SIN CONECTIVIDAD' }}
          Certificado : {{ 'VALIDO' if item.certificate_valid else 'NO VALIDADO / ERROR TLS' }}
          Resultado   : {{
            'OK - DNS, TCP/443 y TLS validados'
            if item.connected and item.certificate_valid
            else 'FALLO - revise el detalle de diagnóstico'
          }}
          ------------------------------------------------------------
          {% endfor %}
      changed_when: false

    - name: Mostrar diagnóstico solo de destinos con fallo
      ansible.builtin.debug:
        msg: |
          ============================================================
          DIAGNOSTICO DE FALLO: {{ item.name }}
          ============================================================
          Host: {{ item.host }}:{{ item.port }}
          Exit code: {{ item.rc }}

          {{ item.output }}
      loop: "{{ connectivity_summary }}"
      loop_control:
        label: "{{ item.name }}"
      when: not item.connected or not item.certificate_valid
      changed_when: false

    - name: Fallar el Job si algún destino no es accesible
      ansible.builtin.assert:
        that:
          - item.connected
          - item.certificate_valid
        fail_msg: >-
          Falla de conectividad o certificado hacia
          {{ item.name }}: https://{{ item.host }}:{{ item.port }}.
        success_msg: >-
          Conectividad HTTPS correcta hacia
          {{ item.name }}: https://{{ item.host }}:{{ item.port }}.
      loop: "{{ connectivity_summary }}"
      loop_control:
        label: "{{ item.name }} — {{ item.host }}:{{ item.port }}"
