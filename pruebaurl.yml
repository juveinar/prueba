---
- name: Prueba de salida HTTPS desde AWX
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    endpoints_https:
      - name: CrowdStrike
        host: ts01-gyr-maverick.cloudsink.net
        port: 443

      - name: Claro Cloud VCD
        host: vcd.clarocloud.com
        port: 443

  tasks:
    - name: Validar TLS por TCP 443
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - "{{ item.host }}:{{ item.port }}"
          - -servername
          - "{{ item.host }}"
          - -brief
      loop: "{{ endpoints_https }}"
      loop_control:
        label: "{{ item.name }} — {{ item.host }}:{{ item.port }}"
      register: tls_checks
      changed_when: false
      failed_when: false

    - name: Mostrar resultado completo de OpenSSL
      ansible.builtin.debug:
        msg:
          - "Destino: {{ item.item.name }} — {{ item.item.host }}:{{ item.item.port }}"
          - "Código de retorno: {{ item.rc }}"
          - "STDOUT: {{ item.stdout | default('') }}"
          - "STDERR: {{ item.stderr | default('') }}"
      loop: "{{ tls_checks.results }}"
      loop_control:
        label: "{{ item.item.host }}"

    - name: Validar handshake TLS y certificado
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - "'CONNECTION ESTABLISHED' in ((item.stdout | default('')) ~ '\n' ~ (item.stderr | default('')))"
          - "'Verification: OK' in ((item.stdout | default('')) ~ '\n' ~ (item.stderr | default('')))"
        fail_msg: >-
          Falló la conexión TLS confiable desde AWX hacia
          {{ item.item.name }} ({{ item.item.host }}:{{ item.item.port }}).
          Revise la tarea anterior para distinguir DNS, TCP, TLS o cadena de CA.
        success_msg: >-
          Conexión TLS confiable validada desde AWX hacia
          {{ item.item.name }} ({{ item.item.host }}:{{ item.item.port }}).
      loop: "{{ tls_checks.results }}"
      loop_control:
        label: "{{ item.item.name }} — {{ item.item.host }}:{{ item.item.port }}"
